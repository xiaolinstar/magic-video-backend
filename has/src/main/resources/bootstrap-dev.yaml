spring:
  application:
    name: has

  # Nacos配置
  cloud:
    nacos:
      server-addr: localhost:8848

      # 服务发现
      discovery:
        cluster-name: NANJING
        # 设置为非临时实例
        ephemeral: true
        group: DEFAULT_GROUP

      # 服务配置
      config:
        file-extension: yaml # 文件后缀名
        group: DEFAULT_GROUP
        enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:xiaolin}
    password: ${RABBITMQ_DEFAULT_PASS:123456rabbit}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:/dev-media}
    connection-timeout: 15000

dubbo:
  application:
    name: dubbo-has-consumer
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://localhost:8848
    group: DEV_DUBBO_GROUP

minio:
  endpoint: http://localhost:9020/
  access-key: ${MINIO_ACCESS_KEY:bnY5rNCWoZUXNSk7CcR0}
  secret-key: ${MINIO_SECRET_KEY:xehoJrBBQrsYWv0aZC7yoH3jlPFQ4HusBhubmaRF}

  hls:
    bucket-name: magic-hls
  dash:
    bucket-name: magic-dash
app:
  hls-file-dir: hls-video
  dash-file-dir: dash-video


