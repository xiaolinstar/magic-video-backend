spring:
  application:
    name: has

  rabbitmq:
    host: magic-rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:xiaolin}
    password: ${RABBITMQ_DEFAULT_PASS:123456rabbit}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:/local-media}
    connection-timeout: 15000

core:
  base-url: http://magic-core:9001

minio:
  endpoint: http://magic-has-minio:9000
  access-key: ${MINIO_ACCESS_KEY:bnY5rNCWoZUXNSk7CcR0}
  secret-key: ${MINIO_SECRET_KEY:xehoJrBBQrsYWv0aZC7yoH3jlPFQ4HusBhubmaRF}

  hls:
    bucket-name: magic-hls
  dash:
    bucket-name: magic-dash

app:
  hls-file-dir: hls-video
  dash-file-dir: dash-video
  # 单次 ffmpeg 转码的最长执行时间（分钟），超时强制结束进程
  transcode-timeout-minutes: 120
  # 转码消费者并发度：每个消费者线程同时只处理一个转码任务
  transcode:
    concurrency: 2
