spring:
  application:
    name: auth

  # 权限数据库magic_auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    url: jdbc:mysql://magic-mysql:3306/magic_auth?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&autoReconnect=true

  # 与 core 共用 magic-redis:6379；Sa-Token key 前缀为 token-name（sa-token:）
  data:
    redis:
      client-type: lettuce
      database: 0
      host: magic-redis
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
        # idle连接自动关闭时间
        shutdown-timeout: 100ms

# Sa-Token
sa-token:
  token-name: sa-token
  active-timeout: 2592000
  dynamic-active-timeout: on
  is-concurrent: true
  is-log: true
