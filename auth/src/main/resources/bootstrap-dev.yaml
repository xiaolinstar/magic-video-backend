spring:
  application:
    name: auth

  # 宿主机连接 compose 发布的唯一 Redis（magic-redis:6379）；key 前缀 sa-token:
  data:
    redis:
      client-type: lettuce
      database: 0
      host: localhost
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 200
          max-idle: 8

  # 权限数据库dev_auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    # Override via MYSQL_PASSWORD env var; default is the local docker-compose dev password.
    password: ${MYSQL_PASSWORD:123456}
    url: jdbc:mysql://localhost:3306/dev_auth?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&autoReconnect=true

# Sa-Token
sa-token:
  token-name: sa-token
  active-timeout: 2592000
  dynamic-active-timeout: on
  is-concurrent: true
  is-log: true
