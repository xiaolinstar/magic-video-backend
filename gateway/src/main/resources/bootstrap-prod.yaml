spring:
  application:
    name: gateway

  # Gateway不使用Servlet而是WebFlux
  main:
    web-application-type: reactive

  cloud:
    gateway:
      default-filters:
        # http请求的Header中增加 k, v
        - AddRequestHeader=gateway-env, gateway-prod

      # 前端每个请求uri会拼接一个版本前缀发送到特定的服务
      # 直连模式：不走服务发现，地址为 compose 网络内的容器名
      routes:
        - id: auth
          uri: http://magic-auth:8999
          filters:
            # 服务版本前缀
            - PrefixPath=/api/v1
          predicates:
            - Path=/auth/**

        - id: multimedia
          uri: http://magic-multimedia:9002
          filters:
            - PrefixPath=/api/v1
          predicates:
            - Path=/multimedia/**

        - id: core
          uri: http://magic-core:9001
          filters:
            - PrefixPath=/api/v1
          predicates:
            - Path=/core/**

# Sa-Token
sa-token:
  token-name: sa-token
  active-timeout: 2592000
  dynamic-active-timeout: on
  is-concurrent: true
  is-log: true

dubbo:
  application:
    qos-enable: false # 生产环境关闭
    name: dubbo-gateway
  protocol:
    name: dubbo
    port: 20882
  # 直连 auth 的权限服务（不使用注册中心）
  auth:
    host: magic-auth
    port: 20880
