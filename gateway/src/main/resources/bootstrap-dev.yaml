spring:
  application:
    name: gateway

  cloud:
    gateway:
      default-filters:
        # http请求的Header中增加 k, v
        - AddRequestHeader=gateway-env, gateway-dev

      # 前端个请求uri会拼接一个版本前缀发送到特定的服务
      routes:
        - id: auth
          uri: http://localhost:8999
          filters:
            # 服务版本前缀
            - PrefixPath=/api/v1
          predicates:
            - Path=/auth/**

        - id: multimedia
          uri: http://localhost:9002
          filters:
            - PrefixPath=/api/v1
          predicates:
            - Path=/multimedia/**

        - id: core
          uri: http://localhost:9001
          filters:
            - PrefixPath=/api/v1
          predicates:
            - Path=/core/**

  # 宿主机连接 compose 发布的唯一 Redis（magic-redis:6379）；key 前缀 sa-token:
  data:
    redis:
      client-type: lettuce
      database: 0
      host: localhost
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 200
          max-idle: 10
          min-idle: 0

# Sa-Token
sa-token:
  token-name: sa-token
  active-timeout: 2592000
  dynamic-active-timeout: on
  is-concurrent: true
  is-log: true

auth:
  base-url: http://localhost:8999
