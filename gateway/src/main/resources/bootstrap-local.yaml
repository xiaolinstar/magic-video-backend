spring:
  application:
    name: gateway

  cloud:
    gateway:
      default-filters:
        # http请求的Header中增加 k, v
        - AddRequestHeader=gateway-env, gateway-local

      # 前端个请求uri会拼接一个版本前缀发送到特定的服务
      routes:
        - id: auth
          uri: http://magic-auth:8999
          filters:
            # 服务版本前缀
            - PrefixPath=/api/v1
          predicates:
            - Path=/auth/**

        - id: multimedia
          uri: http://magic-multimedia:9002
          filters:
            - PrefixPath=/api/v1
          predicates:
            - Path=/multimedia/**

        - id: core
          uri: http://magic-core:9001
          filters:
            - PrefixPath=/api/v1
          predicates:
            - Path=/core/**

  # 微服务分布式鉴权专用Redis
  data:
    redis:
      client-type: lettuce
      database: 0
      host: magic-auth-redis
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 200
          max-idle: 10
          min-idle: 0

# Sa-Token
sa-token:
  token-name: sa-token
  active-timeout: 2592000
  dynamic-active-timeout: on
  is-concurrent: true
  is-log: true

dubbo:
  application:
    name: dubbo-gateway-consumer
  protocol:
    name: dubbo
    port: 20882
  # 直连 auth 的权限服务（不使用注册中心）
  auth:
    host: magic-auth
    port: 20880
