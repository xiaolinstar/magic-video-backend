asyncapi: "2.6.0"
info:
  title: transcode
  version: 1.0.0
  description: |
    转码管线 RabbitMQ 契约。交换机/队列名与 multimedia、has 的 `MessageQueueConsts` 一致。
    JSON 字段是契约：`TranscodeMessage` 为 sourceUrl、videoId、resourceKey；
    `ResourceMessage` 为 id、md5、mp4、m3u8、mpd。
    生产端 DTO 在 `cn.xiaolin.multimedia.mq`，消费端 DTO 在 `cn.xiaolin.has.mq`。
    监听方法使用具体参数类型反序列化，因此两端类名可以不同。
    仍接受历史 `__TypeId__`：`cn.xiaolin.message.entity.TranscodeMessage` / `ResourceMessage`。

defaultContentType: application/json

servers:
  rabbitmq:
    url: amqp://rabbitmq:5672
    protocol: amqp
    description: 集群内 RabbitMQ（fanout + DLX）

channels:
  video.resource:
    description: |
      主队列 `video.resource`（`QUEUE_MEDIA_RESOURCE`），绑定 fanout 交换机 `xiaolin.media`（`EXCHANGE_MEDIA_RESOURCE`）。
      失败重投耗尽后进入死信交换机 `xiaolin.media.dlx`（`EXCHANGE_MEDIA_RESOURCE_DLQ`）与队列 `video.resource.dlq`（`QUEUE_MEDIA_RESOURCE_DLQ`）。
    bindings:
      amqp:
        is: queue
        queue:
          name: video.resource
        exchange:
          name: xiaolin.media
          type: fanout
    publish:
      summary: multimedia → has 转码任务（当前实现）
      message:
        $ref: "#/components/messages/TranscodeMessage"
    subscribe:
      summary: has 消费转码任务
      message:
        $ref: "#/components/messages/TranscodeMessage"

  video.resource.legacy:
    description: |
      同一交换机上的 `ResourceMessage` 形态（元数据回写 / 规划中的 DTO 传输，见架构文档 P0-1）。
      仍使用 `EXCHANGE_MEDIA_RESOURCE` / `QUEUE_MEDIA_RESOURCE`。
    bindings:
      amqp:
        is: queue
        queue:
          name: video.resource
        exchange:
          name: xiaolin.media
          type: fanout
    publish:
      message:
        $ref: "#/components/messages/ResourceMessage"

components:
  messages:
    TranscodeMessage:
      name: TranscodeMessage
      title: 转码任务消息
      summary: MessageProducer.sendTranscodeMessage 投递的载荷
      payload:
        $ref: "#/components/schemas/TranscodeMessage"
      examples:
        - payload:
            sourceUrl: "http://magic-multimedia-minio:9000/magic-video/abc123.mp4"
            videoId: 10011
            resourceKey: "0a1b2c3d4e5f60718293a4b5c6d7e8f9"
    ResourceMessage:
      name: ResourceMessage
      title: 资源元数据消息
      summary: 转码完成或资源登记时的路径字段
      payload:
        $ref: "#/components/schemas/ResourceMessage"
      examples:
        - payload:
            id: 10001
            md5: "0a1b2c3d4e5f60718293a4b5c6d7e8f9"
            mp4: "raw/10001.mp4"
            m3u8: "transcoded/10001/index.m3u8"
            mpd: "transcoded/10001/manifest.mpd"

  schemas:
    TranscodeMessage:
      type: object
      required: [sourceUrl]
      properties:
        sourceUrl:
          type: string
          description: 源视频访问地址（mp4），供 ffmpeg 拉取
        videoId:
          type: integer
          format: int64
          description: 影视 id（`video_source.video_id`）
        resourceKey:
          type: string
          description: 资源标识 / 转码幂等键（源对象名去后缀）
    ResourceMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 资源 Id
        md5:
          type: string
          description: 资源摘要
        mp4:
          type: string
          description: 视频资源路径
        m3u8:
          type: string
          description: HLS 资源路径
        mpd:
          type: string
          description: DASH 资源路径
