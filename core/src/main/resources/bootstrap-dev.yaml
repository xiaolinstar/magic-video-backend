spring:
  application:
    name: core

  # 本地MySQL容器，scheme名称：dev_magic_video
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    # Override via MYSQL_PASSWORD env var; default is the local docker-compose dev password.
    password: ${MYSQL_PASSWORD:123456}
    url: jdbc:mysql://localhost:3306/dev_magic_video?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&autoReconnect=true

  # 消息队列
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:xiaolin}
    password: ${RABBITMQ_DEFAULT_PASS:123456rabbit}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:/dev-media}
    connection-timeout: 15000

  data:
    # 数据库缓存，Redis 端口号6389
    redis:
      client-type: lettuce
      database: 0
      host: localhost
      port: 6389
      lettuce:
        pool:
          enabled: true
          max-active: 200
          max-idle: 8
