spring:
  application:
    name: multimedia

  rabbitmq:
    host: localhost
    username: ${RABBITMQ_DEFAULT_USER:xiaolin}
    password: ${RABBITMQ_DEFAULT_PASS:123456rabbit}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:/dev-media}
    connection-timeout: 15000

minio:
  endpoint: http://localhost:9010
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:xiaolin123minio}

  image:
    bucket-name: raw
  video:
    bucket-name: raw

app:
  core-size: 3
  max-pool-size: 4
  queue-capacity: 8
  thread-prefix: MediaThread-

  video-file-dir: magic-video


